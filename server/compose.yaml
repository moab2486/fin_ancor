services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fin_anchor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Port intentionally not exposed to the host — only internal services need it
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fin_anchor"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fin_anchor?schema=public
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:-00000000000000000000000000000000}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      JWT_SECRET: ${JWT_SECRET}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET}
      REDIS_URL: redis://redis:6379
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      waha:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  waha:
    platform: linux/amd64
    image: devlikeapro/waha:latest
    environment:
      WHATSAPP_API_KEY: ${WAHA_API_KEY:-00000000000000000000000000000000}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: ${WHATSAPP_SWAGGER_USERNAME}
      WHATSAPP_SWAGGER_PASSWORD: ${WHATSAPP_SWAGGER_PASSWORD}
      WHATSAPP_START_SESSION: ${WAHA_SESSION:-default}
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_PRINT_QR: "false"
      WHATSAPP_API_KEY_EXCLUDE_PATH: "ping,health"
    expose:
      - "3000"
    volumes:
      - waha_sessions:/app/.sessions
      - waha_media:/app/.media
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8082:8082"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
      waha:
        condition: service_healthy

volumes:
  postgres_data:
  waha_sessions:
  waha_media:
  redis_data:
